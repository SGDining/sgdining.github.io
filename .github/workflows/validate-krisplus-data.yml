name: Validate Kris+ data

on:
  push:
    branches: [main]
    paths:
      - 'data/krisplus-v2/chunk-*.txt'
      - 'krisplus-data-1730.js'
      - '.github/workflows/validate-krisplus-data.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compact Kris+ dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          parts = []
          for i in range(1, 13):
              p = Path(f'data/krisplus-v2/chunk-{i:02d}.txt')
              assert p.exists(), f'Missing {p}'
              parts.append(p.read_text(encoding='utf-8'))

          data = json.loads(''.join(parts))
          rows = data.get('rows') or []
          assert data.get('source_rows') == 1730, data.get('source_rows')
          assert len(rows) == 1730, len(rows)

          merchants = data['merchants']
          outlets = data['outlets']
          categories = data['categories']
          locations = data['locations']

          decoded = []
          for mi, oi, ci, li, mpd in rows:
              decoded.append((merchants[mi], outlets[oi], categories[ci], locations[li], mpd))

          required = {
              ('Avocadoria Singapore', 'Bedok Mall'),
              ('Skechers', 'Bedok Mall'),
              ('Canton Paradise', 'Bedok Mall'),
              ("LeNu Chef Wai's Noodle Bar", 'Bedok Mall'),
              ('SF Fruits & Juices', 'Bedok Mall'),
              ('MODE AESTHETICS', 'Bedok Mall'),
              ('Nailz Treats', 'Bedok Mall'),
          }
          present = {(m, o) for m, o, *_ in decoded}
          missing = required - present
          assert not missing, f'Missing regression outlets: {sorted(missing)}'

          print(f'Kris+ validation OK: {len(rows)} rows, {len(set(merchants))} merchants')
          PY
