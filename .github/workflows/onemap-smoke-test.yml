name: OneMap smoke test

on:
  push:
    paths:
      - '.github/workflows/onemap-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test OneMap credentials and Orchard Towers search
        env:
          ONEMAP_API_EMAIL: ${{ secrets.ONEMAP_API_EMAIL }}
          ONEMAP_API_PASSWORD: ${{ secrets.ONEMAP_API_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse

          email = os.getenv('ONEMAP_API_EMAIL','')
          password = os.getenv('ONEMAP_API_PASSWORD','')
          if not email or not password:
              raise SystemExit('FAIL: OneMap GitHub secrets are missing')

          auth_req = urllib.request.Request(
              'https://www.onemap.gov.sg/api/auth/post/getToken',
              data=json.dumps({'email': email, 'password': password}).encode(),
              headers={'Content-Type':'application/json'},
              method='POST'
          )
          with urllib.request.urlopen(auth_req, timeout=30) as r:
              auth = json.load(r)
          token = auth.get('access_token')
          if not token:
              raise SystemExit('FAIL: OneMap authentication did not return an access token')
          print('AUTH_OK')

          params = urllib.parse.urlencode({
              'searchVal':'Orchard Towers',
              'returnGeom':'Y',
              'getAddrDetails':'Y',
              'pageNum':1,
          })
          req = urllib.request.Request(
              'https://www.onemap.gov.sg/api/common/elastic/search?' + params,
              headers={'Authorization': token}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          results = data.get('results') or []
          print('SEARCH_RESULT_COUNT=' + str(len(results)))
          for item in results[:5]:
              print('RESULT=' + ' | '.join(str(item.get(k) or '') for k in ['BUILDING','ROAD_NAME','POSTAL','LATITUDE','LONGITUDE']))
          if not results:
              raise SystemExit('FAIL: OneMap returned no results for Orchard Towers')
          print('ONEMAP_SMOKE_TEST_OK')
          PY
