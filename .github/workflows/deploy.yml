name: Deploy SGDining root site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'program-links.js'
      - 'accor-ui.js'
      - 'benefits-ui.js'
      - 'benefits-ui.css'
      - 'styles.css'
      - 'data/**'
      - 'BLUEPRINT.md'
      - 'README.md'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sgdining-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check program-links.js
          node --check accor-ui.js
          node --check benefits-ui.js

      - name: Preserve current SGDining production datasets
        run: |
          set -euo pipefail
          mkdir -p data
          live='https://sgdining.github.io'
          if curl --fail --location --retry 4 --retry-delay 2 "$live/data/merchants.json" --output "$RUNNER_TEMP/merchants-live.json"; then
            cp "$RUNNER_TEMP/merchants-live.json" data/merchants.json
            echo 'Using current SGDining production merchants as deploy baseline.'
          else
            echo '::warning::Could not fetch current live merchants; using repository copy.'
          fi
          if curl --fail --location --retry 3 --retry-delay 2 "$live/data/eatigo_today.json" --output "$RUNNER_TEMP/eatigo-live.json"; then
            cp "$RUNNER_TEMP/eatigo-live.json" data/eatigo_today.json
            echo 'Using current SGDining Eatigo snapshot as deploy baseline.'
          else
            echo '::warning::Could not fetch current Eatigo snapshot; using repository copy.'
          fi

      - name: Validate deployment datasets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          merchants=json.loads(Path('data/merchants.json').read_text(encoding='utf-8')).get('merchants',[])
          live=json.loads(Path('data/eatigo_today.json').read_text(encoding='utf-8'))
          mapped=sum(m.get('lat') is not None and m.get('lng') is not None for m in merchants)
          eatigo=[m for m in merchants if m.get('eatigo') and m.get('eatigo_url')]
          accor=[m for m in merchants if m.get('accor')]
          print(f'merchants={len(merchants)} mapped={mapped} eatigo={len(eatigo)} accor={len(accor)} live_attempted={live.get("restaurants_attempted")}')
          if len(merchants) < 500 or mapped < 400:
              raise SystemExit('Refusing to deploy an unexpectedly small SGDining merchant dataset')
          if len(eatigo) < 200:
              raise SystemExit('Refusing to deploy an incomplete Eatigo directory')
          if len(accor) < 20:
              raise SystemExit('Refusing to deploy an incomplete Accor set')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy SGDining root site
        id: deployment
        uses: actions/deploy-pages@v4
