name: Validate Kris+ runtime fix

on:
  push:
    branches:
      - fix/krisplus-nearby-tooltip-20260827

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check runtime-health-fix.js
          node --check krisplus-ui.js
          node --check krisplus-location-pin-fix.js
      - name: Diagnose current Kris+ compact data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          parts = [Path(f"data/krisplus-v2/chunk-{i:02d}.txt").read_text(encoding="utf-8") for i in range(1, 11)]
          for i,p in enumerate(parts,1):
              print(i, len(p), repr(p[:60]), repr(p[-100:]))
          raw=''.join(parts)
          print('TOTAL',len(raw),'TAIL',repr(raw[-300:]))
          try:
              data=json.loads(raw)
              print('FULL JSON OK',len(data.get('rows') or []))
          except Exception as e:
              print('FULL JSON ERROR',repr(e))
          cut=raw.rfind(',[')
          partial=json.loads(raw[:cut]+']}')
          print('PARTIAL ROWS',len(partial.get('rows') or []),'LAST',partial.get('rows',[])[-3:])
          PY
      - name: Check runtime wiring
        run: |
          grep -q 'runtime-health-fix.js' index.html
          grep -q 'runtime=20260827-2205' runtime-health-fix.js
          grep -q 'tooltipopen' runtime-health-fix.js
