name: Repair Kris+ compact data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-krisplus-compact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair compact chunks from verified CSV reconstruction
        run: |
          python - <<'PY'
          from pathlib import Path

          p8=Path('data/krisplus-v2/chunk-08.txt')
          s=p8.read_text(encoding='utf-8')

          replacements=[
            ('["13 DEMPSEY ROAD ILLUMINATE DEMPSEY ROAD SINGAPORE 249537","249537",1.304724962097854,103.8102360722571,"high"]',
             '["13 DEMPSEY ROAD ILLUMINATE DEMPSEY ROAD (TANGLING VILLAGE)","NIL",1.304724962097854,103.8102360722571,"high"]'),
            ('["11 DEPMSEY ROAD HARRY\'S DEMPSEY HILL DEMPSEY CLUSTER (TANGLIN VILLAGE)","NIL",1.304056809306878,103.81012569095,"high"]',
             '["11 DEMPSEY ROAD HARRY\'S DEMPSEY HILL DEMPSEY CLUSTER (TANGLIN VILLAGE)","NIL",1.304056809306878,103.81012569095,"high"]'),
          ]
          for old,new in replacements:
              assert old in s, f'chunk-08 expected source text missing: {old[:50]}'
              s=s.replace(old,new,1)

          low='["3781 JALAN BUKIT MERAH CALTEX JALAN BUKIT MERAH SINGAPORE 159463","159463",1.284419250290974,103.8149601837508,"low"]'
          high='["3781 JALAN BUKIT MERAH CALTEX JALAN BUKIT MERAH SINGAPORE 159463","159463",1.284419250290974,103.8149601837508,"high"]'
          pos=s.rfind(low)
          assert pos >= 0, 'chunk-08 second Caltex confidence record missing'
          s=s[:pos]+high+s[pos+len(low):]
          p8.write_text(s,encoding='utf-8')

          p10=Path('data/krisplus-v2/chunk-10.txt')
          s=p10.read_text(encoding='utf-8')
          before='[76,120,10,95,3.0],[27,128,16,102,2.0]'
          missing=[
            [27,124,16,99,2.0],[17,120,13,95,3.0],[151,120,12,95,2.0],[96,120,26,95,2.0],
            [125,120,5,95,3.0],[22,120,3,95,2.0],[91,120,26,95,1.0],[141,120,4,95,2.0],
            [152,120,5,95,2.0],[98,120,11,95,2.0],[89,120,4,95,2.0],[153,120,11,95,3.0],
            [19,120,1,95,0.5],[95,120,27,95,1.0],[154,120,26,95,2.0],[14,120,11,95,2.0],
            [8,125,5,100,0.5],[5,120,5,95,2.0],[16,120,3,95,5.0],[90,120,11,95,3.0],
            [155,126,11,95,2.0],[156,120,5,95,3.0],[3,120,3,95,2.0],[16,112,3,90,5.0],
            [8,127,5,101,0.5],[157,127,6,101,2.0],[81,127,3,101,0.5]
          ]
          encoded=','.join('['+','.join(str(x) for x in row)+']' for row in missing)
          after='[76,120,10,95,3.0],'+encoded+',[27,128,16,102,2.0]'
          assert before in s, 'chunk-10 insertion marker missing'
          s=s.replace(before,after,1)
          p10.write_text(s,encoding='utf-8')

          assert len(p8.read_text(encoding='utf-8')) == 9585
          assert len(p10.read_text(encoding='utf-8')) == 9585
          print('Repaired chunk-08 and chunk-10 to 9585 chars each')
          PY
      - name: Commit repair
        run: |
          git config user.name "SGDining Data Repair"
          git config user.email "actions@users.noreply.github.com"
          git add data/krisplus-v2/chunk-08.txt data/krisplus-v2/chunk-10.txt
          git diff --cached --quiet && exit 0
          git commit -m "Repair Kris+ compact dataset from 1730-row source"
          git push origin HEAD:main
