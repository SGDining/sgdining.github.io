name: Refresh SGDining Eatigo offers hourly

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sgdining-pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore current SGDining production datasets
        run: |
          set -euo pipefail
          mkdir -p data
          live='https://sgdining.github.io'
          curl --fail --location --retry 4 --retry-delay 2 "$live/data/merchants.json" --output data/merchants.json
          curl --fail --location --retry 3 --retry-delay 2 "$live/data/eatigo_today.json" --output "$RUNNER_TEMP/eatigo-today-last-good.json" || true
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/merchants.json').read_text(encoding='utf-8')).get('merchants',[])
          eatigo=[m for m in rows if m.get('eatigo') and m.get('eatigo_url')]
          accor=[m for m in rows if m.get('accor')]
          print(f'Current SGDining production: merchants={len(rows)} Eatigo={len(eatigo)} Accor={len(accor)}')
          if len(rows) < 500 or len(eatigo) < 200 or len(accor) < 20:
              raise SystemExit('Refusing hourly refresh because current SGDining production data is incomplete')
          PY

      - name: Refresh today's Eatigo offers
        run: |
          set +e
          python scripts/refresh_eatigo_today.py --limit 0 --workers 8
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if [ -s "$RUNNER_TEMP/eatigo-today-last-good.json" ]; then
              echo '::warning::Eatigo refresh failed; retaining the current SGDining production snapshot.'
              cp "$RUNNER_TEMP/eatigo-today-last-good.json" data/eatigo_today.json
            else
              exit "$status"
            fi
          fi

      - name: Verify hourly snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/eatigo_today.json').read_text(encoding='utf-8'))
          attempted=int(d.get('restaurants_attempted') or 0)
          errors=int(d.get('request_errors') or 0)
          print(f'attempted={attempted} future_slots={d.get("restaurants_with_future_slots")} cuisines={d.get("restaurants_with_cuisine")} errors={errors} seconds={d.get("refresh_seconds")}')
          if attempted < 200:
              raise SystemExit('Hourly Eatigo snapshot is incomplete')
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy hourly Eatigo snapshot
        id: deployment
        uses: actions/deploy-pages@v4
